[package]
name = "tactus-o1-native-vault-script"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[workspace]

[dependencies]
alloy-primitives = { version = "=1.6.0", default-features = false }
blake2b-ref = "=0.3.1"
ckb-std = { version = "=0.15.3", default-features = false, features = ["ckb-types", "allocator"] }
tactus-o1-state-proof-script = { path = "../ckb-state-proof", default-features = false }

[build-dependencies]
serde_json = "=1.0.151"

[lib]
crate-type = ["staticlib", "rlib"]

[profile.release]
debug = false
panic = "abort"

[dev-dependencies]
alloy-trie = { version = "=0.9.8", default-features = false, features = ["ethereum"] }
alloy-rlp = { version = "=0.3.16", default-features = false }

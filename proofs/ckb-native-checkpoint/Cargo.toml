[package]
name = "tactus-o1-native-checkpoint-script"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
[workspace]
[dependencies]
ckb-std = { version = "=0.15.3", default-features = false, features = ["ckb-types", "allocator"] }
tactus-o1-protocol = { path = "../../crates/tactus-o1-protocol", features = ["native-bridge"] }
[dev-dependencies]
serde_json = "=1.0.151"
hex = "0.4"
[lib]
crate-type = ["staticlib", "rlib"]
[profile.release]
debug = false
panic = "abort"

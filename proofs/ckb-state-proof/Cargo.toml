[package]
name = "tactus-o1-state-proof-script"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[workspace]

[features]
default = ["entry"]
entry = []

[dependencies]
alloy-primitives = { version = "=1.6.0", default-features = false, features = ["rlp"] }
alloy-trie = { version = "=0.9.8", default-features = false, features = ["ethereum"] }
alloy-rlp = { version = "=0.3.16", default-features = false }
ckb-std = { version = "=0.15.3", default-features = false, features = ["ckb-types", "allocator"] }

[dev-dependencies]
serde_json = "=1.0.151"

[lib]
crate-type = ["rlib"]

[profile.release]
debug = false
panic = "abort"

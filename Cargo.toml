[workspace]
resolver = "2"
members = [
    "crates/tactus-protocol",
    "crates/tactus-experiment-a",
    "crates/tactus-ordering-script",
    "crates/tactus-devnet-driver",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Tactus-Labs/tactus"

[workspace.lints.rust]
missing_docs = "warn"

[profile.release]
debug = true

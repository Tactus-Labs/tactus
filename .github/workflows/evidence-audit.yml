name: retained-evidence-audit
on:
  push:
    branches: [main]
  pull_request:

jobs:
  sustained-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile signed load evidence and reject corrupted claims
        run: python3 scripts/test-load-analysis.py
      - name: Verify retained load archive checksums
        working-directory: specs/evidence/sustained-load
        run: sha256sum --check SHA256SUMS

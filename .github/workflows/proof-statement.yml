name: execution-proof-statement
on:
  push:
    branches: [main]
  pull_request:

jobs:
  statement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: proofs/sp1
      - name: Check shared proof statement against signed Geth fixtures
        run: cargo test --locked --manifest-path proofs/sp1/Cargo.toml -p tactus-o1-proof-journal
      - name: Check proof workspace formatting
        run: cargo fmt --manifest-path proofs/sp1/Cargo.toml --all -- --check
      - name: Lint shared statement and adversarial tests
        run: cargo clippy --locked --manifest-path proofs/sp1/Cargo.toml -p tactus-o1-proof-journal --all-targets -- -D warnings
      - name: Check retained proof artifact integrity (not cryptographic verification)
        run: |
          (cd specs/evidence/proof-execution && sha256sum --check SHA256SUMS)
          (cd specs/evidence/execution-core-proof && sha256sum --check SHA256SUMS)
          (cd specs/evidence/execution-groth16-proof && sha256sum --check SHA256SUMS)
          (cd specs/evidence/history-checkpoint && sha256sum --check SHA256SUMS)
          (cd specs/evidence/checkpoint-reorg && sha256sum --check SHA256SUMS)
          (cd specs/evidence/settlement-bootstrap && sha256sum --check SHA256SUMS)
          (cd specs/evidence/chain-proof-recovery && sha256sum --check SHA256SUMS)
          (cd specs/evidence/settlement-next-input && sha256sum --check SHA256SUMS)
      - name: Reconcile retained checkpoint transactions (not script execution)
        run: |
          for version in 0.210.0; do
            gzip -dc "specs/evidence/history-checkpoint/$version/evidence.json.gz" > "$RUNNER_TEMP/checkpoint-$version.json"
            python3 scripts/check-history-checkpoints.py "$RUNNER_TEMP/checkpoint-$version.json"
            gzip -dc "specs/evidence/checkpoint-reorg/$version/evidence.json.gz" > "$RUNNER_TEMP/checkpoint-reorg-$version.json"
            python3 scripts/check-checkpoint-reorg.py "$RUNNER_TEMP/checkpoint-reorg-$version.json"
            gzip -dc "specs/evidence/settlement-bootstrap/$version/evidence.json.gz" > "$RUNNER_TEMP/settlement-bootstrap-$version.json"
            python3 scripts/check-settlement-bootstrap.py "$RUNNER_TEMP/settlement-bootstrap-$version.json"
            gzip -dc "specs/evidence/chain-proof-recovery/$version/evidence.json.gz" > "$RUNNER_TEMP/chain-recovery-$version.json"
            python3 scripts/check-settlement-bootstrap.py "$RUNNER_TEMP/chain-recovery-$version.json"
            gzip -dc "specs/evidence/settlement-next-input/$version/evidence.json.gz" > "$RUNNER_TEMP/next-input-$version.json"
            python3 scripts/check-next-proof-input.py "$RUNNER_TEMP/next-input-$version.json"
          done
      - name: Reconcile real proof receipt evidence (not cryptographic verification)
        run: |
          for version in 0.210.0; do
            gzip -dc "specs/evidence/execution-groth16-proof/$version/evidence.json.gz" > "$RUNNER_TEMP/receipt-$version.json"
            python3 scripts/check-proof-receipts.py "$RUNNER_TEMP/receipt-$version.json" specs/evidence/execution-groth16-proof/proof
          done
      - name: Check bounded history checkpoint state rules
        run: cargo test --locked --manifest-path proofs/ckb-history-checkpoint/Cargo.toml
      - name: Check SettlementTip state binding and verifier-port provenance
        run: |
          cargo test --locked --manifest-path proofs/ckb-settlement/Cargo.toml
          python3 scripts/check-ckb-verifier-port.py
          rustc --edition=2021 --deny warnings --test proofs/vendor/lazy_static-1.5.1/src/ckb_lazy.rs -o "$RUNNER_TEMP/ckb-lazy-tests"
          "$RUNNER_TEMP/ckb-lazy-tests" --test-threads=1
          for version in 0.210.0; do
            cargo run --locked --manifest-path proofs/sp1/Cargo.toml -p tactus-o1-proof-journal --example check-chain-input -- "specs/evidence/settlement-bootstrap/$version/proving-input.json"
            cargo run --locked --manifest-path proofs/sp1/Cargo.toml -p tactus-o1-proof-journal --example check-chain-input -- "specs/evidence/settlement-next-input/$version/proving-input-next.json"
          done

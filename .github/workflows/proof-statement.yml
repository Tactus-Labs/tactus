name: execution-proof-statement
on:
  push:
    branches: [main]
  pull_request:

jobs:
  statement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: proofs/sp1
      - name: Check shared proof statement against signed Geth fixtures
        run: cargo test --locked --manifest-path proofs/sp1/Cargo.toml -p tactus-o1-proof-journal
      - name: Check proof workspace formatting
        run: cargo fmt --manifest-path proofs/sp1/Cargo.toml --all -- --check
      - name: Lint shared statement and adversarial tests
        run: cargo clippy --locked --manifest-path proofs/sp1/Cargo.toml -p tactus-o1-proof-journal --all-targets -- -D warnings
      - name: Check retained proof artifact integrity (not cryptographic verification)
        run: |
          (cd specs/evidence/proof-execution && sha256sum --check SHA256SUMS)
          (cd specs/evidence/execution-core-proof && sha256sum --check SHA256SUMS)
          (cd specs/evidence/history-checkpoint && sha256sum --check SHA256SUMS)
      - name: Reconcile retained checkpoint transactions (not script execution)
        run: |
          for version in 0.121.0 0.210.0; do
            gzip -dc "specs/evidence/history-checkpoint/$version/evidence.json.gz" > "$RUNNER_TEMP/checkpoint-$version.json"
            python3 scripts/check-history-checkpoints.py "$RUNNER_TEMP/checkpoint-$version.json"
          done
      - name: Check bounded history checkpoint state rules
        run: cargo test --locked --manifest-path proofs/ckb-history-checkpoint/Cargo.toml
